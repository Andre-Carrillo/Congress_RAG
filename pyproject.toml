[project]
name = "congress-rag"
version = "0.1.0"
description = "Sistema RAG híbrido para consultar actas de votación del Congreso del Perú"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
vector = ["chromadb>=0.5"]
llm = ["ollama>=0.3", "google-genai>=1.0"]
ui = ["streamlit>=1.36"]
all = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "ollama>=0.3",
    "google-genai>=1.0",
    "streamlit>=1.36",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congress_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: pruebas que requieren el corpus real de ushnu-congreso",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
